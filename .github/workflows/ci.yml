name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: General Radar security self-test
        run: SKILLRADAR_SECURITY_SELFTEST=1 node scripts/update-general-radar.mjs
      - name: Build bundled plugin registry
        run: npm run sync:plugin-registry
      - name: Validate registry and offline router
        run: npm run validate
      - name: Plugin-only offline acceptance
        run: npm run validate:plugin-offline
      - name: Router quality benchmark
        run: npm run benchmark:router
      - name: Skill Budget Doctor acceptance
        run: npm run validate:skill-budget
