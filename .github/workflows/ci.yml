name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: General Radar security self-test
        run: SKILLRADAR_SECURITY_SELFTEST=1 node scripts/update-general-radar.mjs
      - name: Design Radar id normalization self-test
        run: SKILLRADAR_DESIGN_DEDUPE_SELFTEST=1 node scripts/dedupe-design-radar.mjs
      - name: Canonical General Radar seed policy
        run: npm run validate:canonical-seeds
      - name: Skill frontmatter parsing policy
        run: npm run validate:skill-frontmatter
      - name: Adoption metrics fixture policy
        run: npm run validate:adoption-metrics
      - name: Public discoverability contract
        run: node scripts/validate-public-discoverability.mjs
      - name: Web UI safety and router parity
        run: node scripts/validate-web-ui.mjs
      - name: Normalize generated general routing tags
        run: npm run normalize:general-tags
      - name: Build bundled plugin registry
        run: npm run sync:plugin-registry
      - name: Registry routing content hash policy
        run: npm run validate:registry-hash
      - name: Exact technology and service anchor matching policy
        run: npm run validate:router-eval-policy
      - name: Validate registry and offline router
        run: npm run validate
      - name: Plugin-only offline acceptance
        run: npm run validate:plugin-offline
      - name: Router quality benchmark
        run: npm run benchmark:router
      - name: Expanded router eval
        run: npm run eval:router
      - name: Shadow ranking snapshot safety and contract gate
        run: npm run shadow:router
      - name: Shadow multi-snapshot promotion policy
        run: npm run validate:shadow-history
      - name: Skill Budget Doctor acceptance
        run: npm run validate:skill-budget
