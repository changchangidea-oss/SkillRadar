name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundled plugin registry
        run: npm run sync:plugin-registry
      - name: Validate registry and offline router
        run: npm run validate
      - name: Plugin-only offline acceptance
        run: npm run validate:plugin-offline
