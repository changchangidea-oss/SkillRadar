name: Router Eval and Shadow Ranking

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1,4'
  push:
    branches: [main]
    paths:
      - 'data/router-eval-v2.json'
      - 'data/skills.json'
      - 'data/design-skills-*.json'
      - 'data/general-skills-radar.json'
      - 'data/general-domains.json'
      - 'packages/codex-plugin/scripts/skillradar.mjs'
      - 'scripts/eval-router.mjs'
      - 'scripts/shadow-router.mjs'
      - 'scripts/shadow-history.mjs'
      - 'scripts/validate-shadow-history.mjs'
      - 'scripts/normalize-general-tags.mjs'
      - 'scripts/sync-codex-plugin-registry.mjs'
      - '.github/workflows/router-shadow.yml'

# The Daily Pipeline is the sole repository writer for generated Registry/Eval/Shadow evidence.
# This workflow may regenerate evidence in its ephemeral workspace, but it can never push it.
permissions:
  contents: read

concurrency:
  group: skillradar-router-shadow
  cancel-in-progress: false

jobs:
  eval-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize general routing tags in workspace
        run: npm run normalize:general-tags
      - name: Refresh bundled registry in workspace
        run: npm run sync:plugin-registry
      - name: Validate Registry routing content hash
        run: npm run validate:registry-hash
      - name: Run release-critical benchmark
        run: npm run benchmark:router
      - name: Run expanded router eval in workspace
        run: SKILLRADAR_EVAL_WRITE=1 npm run eval:router
      - name: Run one shadow snapshot in workspace
        run: SKILLRADAR_SHADOW_WRITE=1 npm run shadow:router
      - name: Update distinct-Registry shadow history in workspace
        run: SKILLRADAR_SHADOW_HISTORY_WRITE=1 npm run shadow:history
      - name: Show auditable summary
        run: |
          node - <<'NODE'
          const e=require('./data/router-eval-latest.json')
          const s=require('./data/router-shadow-latest.json')
          const h=require('./data/router-shadow-history-latest.json')
          console.log(`Eval: ${e.passed}/${e.cases}; contract ${e.contract.passed}/${e.contract.cases}; coverage ${e.coverage.passed}/${e.coverage.cases}; unsafe=${e.unsafeTop3}; avgTop1=${e.averageTop1Score}; avgRecommendations=${e.averageRecommendationCount}; capabilityGaps=${e.capabilityGapCases}`)
          console.log(`Shadow snapshot: ${s.decision}; hashVersion=${s.registrySnapshot?.contentHashVersion}; production=${s.production.passed}/${s.production.cases}; candidate=${s.candidate.passed}/${s.candidate.cases}; evidenceDelta=${s.gates.evidenceDelta}; registry=${s.registrySnapshot?.contentHash||'missing'}`)
          console.log(`Shadow history: ${h.decision}; hashVersion=${h.contentHashVersion}; distinctRegistrySnapshots=${h.uniqueRegistrySnapshots}/${h.requiredSnapshots}; consecutiveWins=${h.consecutiveWins}; aggregateEvidenceDelta=${h.aggregateEvidenceDelta}`)
          NODE
