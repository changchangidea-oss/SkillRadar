name: Publish v0.3.0 Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillradar-release-v0.3.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.0
          fetch-depth: 0
      - name: Build Codex plugin archive
        run: |
          cd packages/codex-plugin
          zip -qr ../../skillradar-codex-plugin-v0.3.0.zip .
      - name: Refresh existing GitHub Release asset only from v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.3.0 skillradar-codex-plugin-v0.3.0.zip --clobber
