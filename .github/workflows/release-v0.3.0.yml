name: Publish v0.3.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.0.yml'
      - 'docs/releases/v0.3.0.md'
      - 'packages/codex-plugin/**'
      - '.agents/plugins/marketplace.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillradar-release-v0.3.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Codex plugin archive
        run: |
          cd packages/codex-plugin
          zip -qr ../../skillradar-codex-plugin-v0.3.0.zip .
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 skillradar-codex-plugin-v0.3.0.zip --clobber
          else
            gh release create v0.3.0 \
              --target "${GITHUB_SHA}" \
              --title "SkillRadar v0.3.0 — Closed-loop Radar" \
              --notes-file docs/releases/v0.3.0.md \
              skillradar-codex-plugin-v0.3.0.zip
          fi
      - name: Record auditable release status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_URL="$(gh release view v0.3.0 --json url --jq .url)"
          RELEASE_CREATED="$(gh release view v0.3.0 --json createdAt --jq .createdAt)"
          cat > data/release-status.json <<EOF
          {
            "version": "v0.3.0",
            "status": "published",
            "releaseUrl": "${RELEASE_URL}",
            "createdAt": "${RELEASE_CREATED}",
            "asset": "skillradar-codex-plugin-v0.3.0.zip",
            "verifiedBy": "GitHub Actions"
          }
          EOF
          git add data/release-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "skillradar-release-bot"
          git config user.email "skillradar-release-bot@users.noreply.github.com"
          git commit -m "chore(release): record v0.3.0 publication"
          git pull --rebase origin main
          git push origin HEAD:main
