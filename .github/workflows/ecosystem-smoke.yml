name: Ecosystem Install Smoke

on:
  pull_request:
    paths:
      - '.agents/plugins/marketplace.json'
      - 'packages/codex-plugin/**'
      - 'scripts/sync-codex-plugin-registry.mjs'
      - 'scripts/validate-plugin-offline.mjs'
      - 'scripts/validate-skill-budget.mjs'
      - 'scripts/benchmark-router.mjs'
      - 'data/router-benchmark.json'
      - 'skills/**'
      - 'package.json'
      - '.github/workflows/ecosystem-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/marketplace.json'
      - 'packages/codex-plugin/**'
      - 'scripts/sync-codex-plugin-registry.mjs'
      - 'scripts/validate-plugin-offline.mjs'
      - 'scripts/validate-skill-budget.mjs'
      - 'scripts/benchmark-router.mjs'
      - 'data/router-benchmark.json'
      - 'skills/**'
      - 'package.json'
      - 'data/release-status.json'
      - 'data/ecosystem-verify-trigger.json'
      - '.github/workflows/ecosystem-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundled plugin registry
        run: npm run sync:plugin-registry
      - name: Validate Codex marketplace and plugin manifest
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const market=JSON.parse(fs.readFileSync('.agents/plugins/marketplace.json','utf8'))
          const plugin=JSON.parse(fs.readFileSync('packages/codex-plugin/.codex-plugin/plugin.json','utf8'))
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'))
          const registry=JSON.parse(fs.readFileSync('packages/codex-plugin/data/registry.json','utf8'))
          if(market.name!=='skillradar') throw new Error('marketplace name mismatch')
          const item=market.plugins.find(x=>x.name==='skillradar')
          if(!item || item.source?.path!=='./packages/codex-plugin') throw new Error('marketplace plugin source mismatch')
          if(plugin.name!=='skillradar' || plugin.version!==pkg.version) throw new Error('plugin/package version mismatch')
          if(registry.schemaVersion!==2 || !Array.isArray(registry.general)) throw new Error('bundled registry must use schema v2 with general shard')
          if(!fs.existsSync('packages/codex-plugin/scripts/skill-budget.mjs')) throw new Error('Skill Budget Doctor missing')
          if(!fs.existsSync('scripts/benchmark-router.mjs')) throw new Error('router benchmark missing')
          if(!fs.existsSync('skills/skillradar/SKILL.md')) throw new Error('skills.sh-compatible SKILL.md missing')
          console.log(`Ecosystem manifests passed for v${plugin.version}.`)
          NODE
      - name: Confirm skills CLI can discover the repo
        run: npx -y skills@latest add . --list --full-depth
      - name: Install current Codex CLI
        run: npm install -g @openai/codex
      - name: Verify plugin-only offline routing
        run: npm run validate:plugin-offline
      - name: Verify router quality benchmark
        run: npm run benchmark:router
      - name: Verify Skill Budget Doctor
        run: npm run validate:skill-budget
      - name: Verify public Codex install when this version is released
        id: public_install
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          RELEASED="$(node -e "try{process.stdout.write(require('./data/release-status.json').version||'')}catch{}")"
          if [ "$RELEASED" != "$VERSION" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Public install check deferred: ${VERSION} is not the recorded release yet."
            exit 0
          fi
          export HOME="${RUNNER_TEMP}/skillradar-home"
          export CODEX_HOME="${HOME}/.codex"
          mkdir -p "$HOME" "$CODEX_HOME"
          codex plugin marketplace add changchangidea-oss/SkillRadar --ref "$VERSION" --json
          codex plugin add skillradar@skillradar --json
          codex plugin list --json > "${RUNNER_TEMP}/plugins.json"
          grep -q 'skillradar' "${RUNNER_TEMP}/plugins.json"
          PLUGIN_ROOT="$(find "$CODEX_HOME" -type f -path '*/skillradar*/scripts/skillradar.mjs' -print -quit | xargs dirname | xargs dirname)"
          test -f "$PLUGIN_ROOT/data/registry.json"
          test -f "$PLUGIN_ROOT/scripts/skill-budget.mjs"
          TEST_PROJECT="${RUNNER_TEMP}/project-aware-fixture"
          mkdir -p "$TEST_PROJECT/app"
          printf '%s\n' '{"dependencies":{"next":"16.0.0","react":"19.0.0","@ai-sdk/react":"1.0.0"}}' > "$TEST_PROJECT/package.json"
          printf '%s\n' '{}' > "$TEST_PROJECT/components.json"
          (cd "$TEST_PROJECT" && SKILLRADAR_OFFLINE=1 node "$PLUGIN_ROOT/scripts/skillradar.mjs" match 'Next.js React shadcn AI dashboard tool calling App Router') > "${RUNNER_TEMP}/route.json"
          node -e 'const r=require(process.argv[1]);if(r.source!=="skillradar-registry"||r.registry?.mode!=="local-bundled"||r.registry?.schemaVersion!==2||r.ranking?.version!=="2.1"||r.context?.mode!=="project-aware"||r.matches?.length!==3||r.matches.some(x=>x.match_details?.ranking_version!=="2.1"))process.exit(1)' "${RUNNER_TEMP}/route.json"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Public Codex marketplace install + ranking v2.1 project-aware offline route passed for ${VERSION}."
      - name: Verify public Codex upgrade from previous stable
        id: public_upgrade
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          VERSION_NUM="${VERSION#v}"
          PREVIOUS_VERSION="v0.4.0"
          RELEASED="$(node -e "try{process.stdout.write(require('./data/release-status.json').version||'')}catch{}")"
          if [ "$RELEASED" != "$VERSION" ]; then
            echo "upgraded=false" >> "$GITHUB_OUTPUT"
            echo "Public upgrade check deferred: ${VERSION} is not the recorded release yet."
            exit 0
          fi
          export HOME="${RUNNER_TEMP}/skillradar-upgrade-home"
          export CODEX_HOME="${HOME}/.codex"
          mkdir -p "$HOME" "$CODEX_HOME"

          codex plugin marketplace add changchangidea-oss/SkillRadar --ref "$PREVIOUS_VERSION" --json
          codex plugin add skillradar@skillradar --json
          codex plugin list --json > "${RUNNER_TEMP}/plugins-before-upgrade.json"
          grep -q 'skillradar' "${RUNNER_TEMP}/plugins-before-upgrade.json"
          grep -q '0.4.0' "${RUNNER_TEMP}/plugins-before-upgrade.json"

          codex plugin remove skillradar@skillradar
          codex plugin marketplace remove skillradar
          codex plugin marketplace add changchangidea-oss/SkillRadar --ref "$VERSION" --json
          codex plugin add skillradar@skillradar --json
          codex plugin list --json > "${RUNNER_TEMP}/plugins-after-upgrade.json"
          grep -q 'skillradar' "${RUNNER_TEMP}/plugins-after-upgrade.json"
          grep -q "$VERSION_NUM" "${RUNNER_TEMP}/plugins-after-upgrade.json"

          PLUGIN_ROOT="$(find "$CODEX_HOME" -type f -path '*/skillradar*/scripts/skillradar.mjs' -print -quit | xargs dirname | xargs dirname)"
          test -f "$PLUGIN_ROOT/data/registry.json"
          test -f "$PLUGIN_ROOT/scripts/skill-budget.mjs"
          SKILLRADAR_OFFLINE=1 SKILLRADAR_PROJECT_CONTEXT=0 node "$PLUGIN_ROOT/scripts/skillradar.mjs" match '建筑可视化和室内空间渲染' > "${RUNNER_TEMP}/upgrade-route.json"
          node -e 'const r=require(process.argv[1]);if(r.registry?.schemaVersion!==2||r.ranking?.version!=="2.1"||r.matches?.length!==3)process.exit(1)' "${RUNNER_TEMP}/upgrade-route.json"
          echo "upgraded=true" >> "$GITHUB_OUTPUT"
          echo "Public Codex upgrade ${PREVIOUS_VERSION} -> ${VERSION} passed with schema-v2 Matching v2.1 routing."
      - name: Record public ecosystem verification
        if: github.event_name != 'pull_request' && steps.public_install.outputs.released == 'true' && steps.public_upgrade.outputs.upgraded == 'true'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          node -e 'const fs=require("fs");const v=process.argv[1];fs.writeFileSync("data/ecosystem-status.json",JSON.stringify({verifiedAt:new Date().toISOString(),version:v,skillsCliDiscovery:"passed",codexMarketplaceInstall:"passed",codexUpgradeFromPrevious:"passed",offlineBundledRouting:"passed",rankingV21:"passed",projectAwareRouting:"passed",routerBenchmark:"passed",skillBudgetDoctor:"passed",command:`codex plugin marketplace add changchangidea-oss/SkillRadar --ref ${v} && codex plugin add skillradar@skillradar`,verifiedBy:"GitHub Actions"},null,2)+"\n")' "$VERSION"
          git add data/ecosystem-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "skillradar-ecosystem-bot"
          git config user.email "skillradar-ecosystem-bot@users.noreply.github.com"
          git commit -m "chore(ecosystem): record ${VERSION} install verification"
          git pull --rebase origin main
          git push origin HEAD:main
