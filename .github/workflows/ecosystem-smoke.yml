name: Ecosystem Install Smoke

on:
  pull_request:
    paths:
      - '.agents/plugins/marketplace.json'
      - 'packages/codex-plugin/**'
      - 'skills/**'
      - '.github/workflows/ecosystem-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/marketplace.json'
      - 'packages/codex-plugin/**'
      - 'skills/**'
      - '.github/workflows/ecosystem-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Codex marketplace and plugin manifest
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const market=JSON.parse(fs.readFileSync('.agents/plugins/marketplace.json','utf8'))
          const plugin=JSON.parse(fs.readFileSync('packages/codex-plugin/.codex-plugin/plugin.json','utf8'))
          if(market.name!=='skillradar') throw new Error('marketplace name mismatch')
          const item=market.plugins.find(x=>x.name==='skillradar')
          if(!item || item.source?.path!=='./packages/codex-plugin') throw new Error('marketplace plugin source mismatch')
          if(plugin.name!=='skillradar' || plugin.version!=='0.3.0') throw new Error('plugin manifest mismatch')
          if(!fs.existsSync('skills/skillradar/SKILL.md')) throw new Error('skills.sh-compatible SKILL.md missing')
          console.log('Ecosystem manifests passed.')
          NODE
      - name: Confirm skills CLI can discover the repo
        run: npx -y skills@latest add . --list --full-depth
      - name: Install current Codex CLI
        run: npm install -g @openai/codex
      - name: Verify the public one-line Codex install path
        shell: bash
        run: |
          export HOME="${RUNNER_TEMP}/skillradar-home"
          export CODEX_HOME="${HOME}/.codex"
          mkdir -p "$HOME" "$CODEX_HOME"
          codex plugin marketplace add changchangidea-oss/SkillRadar --ref v0.3.0 --json
          codex plugin add skillradar@skillradar --json
          codex plugin list --json > "${RUNNER_TEMP}/plugins.json"
          grep -q 'skillradar' "${RUNNER_TEMP}/plugins.json"
          find "$CODEX_HOME/plugins" -type f -name SKILL.md -print | grep -q '/skillradar/'
          echo "Public Codex marketplace install passed."
      - name: Record ecosystem verification
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("data/ecosystem-status.json",JSON.stringify({verifiedAt:new Date().toISOString(),version:"v0.3.0",skillsCliDiscovery:"passed",codexMarketplaceInstall:"passed",command:"codex plugin marketplace add changchangidea-oss/SkillRadar --ref v0.3.0 && codex plugin add skillradar@skillradar",verifiedBy:"GitHub Actions"},null,2)+"\n")'
          git add data/ecosystem-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "skillradar-ecosystem-bot"
          git config user.email "skillradar-ecosystem-bot@users.noreply.github.com"
          git commit -m "chore(ecosystem): record install verification"
          git pull --rebase origin main
          git push origin HEAD:main
